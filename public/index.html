<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아정당 재무 대시보드</title>
  <meta name="theme-color" content="#155ce1" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="side-brand">
        <img class="logo" src="logo-icon.png" alt="아정당" height="38" />
        <span class="side-brand-text">재무</span>
      </div>
      <nav class="menu" id="page-menu" aria-label="메뉴">
        <button data-page="전체" class="active"><span class="mi">📊</span> 전체 대시보드</button>
        <button data-page="이사"><span class="mi">🚚</span> 이사</button>
        <button data-page="청소"><span class="mi">🧹</span> 청소</button>
        <button data-page="부동산"><span class="mi">🏢</span> 부동산</button>
      </nav>
    </aside>

    <main class="content">
      <header class="app-header">
        <h1 id="page-title">이사 · 청소 · 부동산 재무 현황</h1>
        <span id="source-badge" class="badge">불러오는 중…</span>
      </header>

      <section class="filters" id="global-filters" aria-label="필터">
        <label class="field-inline">2026년
          <select id="dash-month-select">
            <option value="전체">전체 (월별 추이)</option>
            <option value="1">1월</option>
            <option value="2">2월</option>
            <option value="3">3월</option>
            <option value="4">4월</option>
            <option value="5">5월</option>
            <option value="6">6월</option>
            <option value="7">7월</option>
            <option value="8">8월</option>
            <option value="9">9월</option>
            <option value="10">10월</option>
            <option value="11">11월</option>
            <option value="12">12월</option>
          </select>
        </label>
      </section>

      <div id="dashboard-view">
        <section class="chart-stack">
          <figure class="card chart-section">
            <div class="card-head">
              <figcaption class="card-title">월별 사업부별 매출 추이</figcaption>
              <span class="unit-tag">단위: 천만원</span>
            </div>
            <p class="chart-desc">달마다 각 사업부가 올린 매출을 쌓아 보여줍니다.</p>
            <div class="chart-box"><canvas id="chart-stacked"></canvas></div>
            <div class="table-scroll" id="tbl-stacked"></div>
          </figure>

          <figure class="card chart-section">
            <div class="card-head">
              <figcaption class="card-title">사업부별 수금 현황</figcaption>
              <span class="unit-tag">단위: 천만원</span>
            </div>
            <p class="chart-desc">사업부별로 수금완료 금액과 아직 못 받은 미수금을 비교합니다.</p>
            <div class="chart-box"><canvas id="chart-collection"></canvas></div>
            <div class="table-scroll" id="tbl-collection"></div>
          </figure>
        </section>
      </div>

      <div id="dept-view" hidden>
        <div class="dept-toolbar">
          <label class="field-inline">월 선택
            <select id="dept-month-select">
              <option value="전체">전체</option>
              <option value="1">1월</option>
              <option value="2">2월</option>
              <option value="3">3월</option>
              <option value="4">4월</option>
              <option value="5">5월</option>
              <option value="6">6월</option>
              <option value="7">7월</option>
              <option value="8">8월</option>
              <option value="9">9월</option>
              <option value="10">10월</option>
              <option value="11">11월</option>
              <option value="12">12월</option>
            </select>
          </label>
        </div>

        <section class="card" id="dept-monthly-section">
          <div class="dept-head">
            <h2 class="card-title">월별 매출 · 지출 상세</h2>
            <div class="dept-head-right">
              <span class="unit-tag">단위: 천만원</span>
              <div class="filter-group" id="dept-mode" role="group" aria-label="보기 방식">
                <button data-mode="월별" class="active">월별</button>
                <button data-mode="누적">누적</button>
              </div>
            </div>
          </div>
          <p class="chart-desc">월별 매출·지출(영업비용)·영업이익입니다. 오른쪽 <b>‘누적’</b>을 누르면 누적 합계로 볼 수 있어요. 맨 아래는 연간(2026) 합계.</p>
          <div class="table-scroll" id="dept-monthly-table"></div>
        </section>

        <section class="card">
          <div class="dept-head">
            <h2 class="card-title" id="dept-title">거래 내역 (엑셀 양식)</h2>
            <span class="badge" id="dept-count"></span>
          </div>
          <p class="chart-desc">각 열의 드롭박스에서 값을 <b>선택하거나 직접 입력</b>해 거를 수 있고, <b>여러 개 동시 선택</b>도 됩니다. 합계는 스크롤해도 하단에 고정됩니다.</p>
          <div class="col-filters" id="col-filters"></div>
          <button class="filter-chip" id="clear-filters" type="button" hidden>필터 전체 해제 ✕</button>
          <div class="table-scroll excel-scroll" id="dept-table"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
